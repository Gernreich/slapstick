[package]
name = "slapstick"
version = "0.1.0"
edition = "2021"
authors = ["Michael Gernreich", "Claude (Anthropic) <noreply@anthropic.com>"]
description = "The slapstick's cut sheets, SolidCraft design and 3D view"
license-file = "LICENSE"
publish = false
autobins = false

# The cut sheets and the SolidCraft design, from the parameters.
[[bin]]
name = "slapstick"
path = "slapstick.rs"

# The 3D page's builder. It reads the cut files with lasermade-tools' turn3d
# module, so it expects that checkout beside this one.
[[bin]]
name = "viewer"
path = "viewer.rs"

[dependencies]
lasermade-tools = { path = "../lasermade-tools" }
