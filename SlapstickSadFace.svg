<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   width="100mm"
   height="100mm"
   viewBox="0 0 100 100"
   version="1.1"
   id="svg1"
   xmlns="http://www.w3.org/2000/svg"
   xmlns:svg="http://www.w3.org/2000/svg"
   xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#"
   xmlns:cc="http://creativecommons.org/ns#"
   xmlns:dc="http://purl.org/dc/elements/1.1/">
  <defs
     id="defs1" />
  <title
     id="title1">Smiley face — eyes and mouth as cut-outs</title>
  <!--
    Units: viewBox is 1 unit = 1 mm, so the face is a 100 mm disc.
    One closed outline (the face) with three inner closed contours
    (two eyes, one mouth). fill-rule="evenodd" makes the inner
    contours render as holes, and cutting software reads them as
    separate closed paths. No islands, so no stencil bridges needed.
  -->
  <path
     d="m 75.981,71.000412 a 30,30 0 0 0 -51.962,0 l 6.928,4 a 22,22 0 0 1 38.106,0 z"
     id="path4"
     style="vector-effect:non-scaling-stroke;fill:none;stroke:#000000;stroke-width:0.264583;stroke-dasharray:none;stroke-opacity:1;-inkscape-stroke:hairline" />
  <path
     d="m 62,36 a 6,6 0 1 0 12,0 6,6 0 1 0 -12,0 z"
     id="path3"
     style="fill:none;stroke:#000000;stroke-opacity:1;vector-effect:non-scaling-stroke;-inkscape-stroke:hairline;stroke-width:0.26458333;stroke-dasharray:none" />
  <path
     d="m 26,36 a 6,6 0 1 0 12,0 6,6 0 1 0 -12,0 z"
     id="path2"
     style="vector-effect:non-scaling-stroke;-inkscape-stroke:hairline;stroke-width:0.26458333;stroke-dasharray:none;fill:none;stroke:#000000;stroke-opacity:1" />
  <path
     d="M 50,0 A 50,50 0 1 0 50,100 50,50 0 1 0 50,0 Z"
     id="path1"
     style="fill:none;stroke:#000000;stroke-opacity:1;vector-effect:non-scaling-stroke;-inkscape-stroke:hairline;stroke-width:0.26458333;stroke-dasharray:none" />
  <metadata
     id="metadata2">
    <rdf:RDF>
      <cc:Work
         rdf:about="">
        <dc:title>Smiley face — eyes and mouth as cut-outs</dc:title>
      </cc:Work>
    </rdf:RDF>
  </metadata>
</svg>
