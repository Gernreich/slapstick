<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   width="110.00mm"
   height="110.00mm"
   viewBox="-5.00 -5.00 110.00 110.00"
   version="1.1"
   id="svg1"
   xmlns="http://www.w3.org/2000/svg"
   xmlns:svg="http://www.w3.org/2000/svg"
   xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#"
   xmlns:cc="http://creativecommons.org/ns#"
   xmlns:dc="http://purl.org/dc/elements/1.1/">
<!-- DISPLAY ONLY - not a cut file. Presentational changes only: the stroke is
     thickened and the hairline hint removed, a light ground is painted in, and the view is
     cropped to the part rather than the whole sheet. Geometry is untouched, and the cut
     file keeps the sheet position your laser expects, plus its own hairline stroke.
     Cut the file in the repository root, not this one. -->
  <rect x="-5.00" y="-5.00" width="110.00" height="110.00" fill="#faf7f0"/>
  <defs
     id="defs1" />
  <title
     id="title1">Smiley face — eyes and mouth as cut-outs</title>
  <!--
    Units: viewBox is 1 unit = 1 mm, so the face is a 100 mm disc.
    One closed outline (the face) with three inner closed contours
    (two eyes, one mouth). fill-rule="evenodd" makes the inner
    contours render as holes, and cutting software reads them as
    separate closed paths. No islands, so no stencil bridges needed.
  -->
  <path
     d="m 75.981,60 a 30,30 0 0 1 -51.962,0 l 6.928,-4 a 22,22 0 0 0 38.106,0 z"
     id="path4"
     style="stroke-width:0.90;stroke-dasharray:none;fill:none;stroke:#000000;stroke-opacity:1" />
  <path
     d="m 62,36 a 6,6 0 1 0 12,0 6,6 0 1 0 -12,0 z"
     id="path3"
     style="fill:none;stroke:#000000;stroke-opacity:1;stroke-width:0.90;stroke-dasharray:none" />
  <path
     d="m 26,36 a 6,6 0 1 0 12,0 6,6 0 1 0 -12,0 z"
     id="path2"
     style="stroke-width:0.90;stroke-dasharray:none;fill:none;stroke:#000000;stroke-opacity:1" />
  <path
     d="M 50,0 A 50,50 0 1 0 50,100 50,50 0 1 0 50,0 Z"
     id="path1"
     style="fill:none;stroke:#000000;stroke-opacity:1;stroke-width:0.90;stroke-dasharray:none" />
  <metadata
     id="metadata2">
    <rdf:RDF>
      <cc:Work
         rdf:about="">
        <dc:title>Smiley face — eyes and mouth as cut-outs</dc:title>
      </cc:Work>
    </rdf:RDF>
  </metadata>
</svg>
