<!-- DISPLAY ONLY - not a cut file.
     The stroke is thickened, a light ground painted in, and the lightest inks
     darkened: green, cyan and orange sit below the 3:1 graphics minimum against any
     light background, so the cut order cannot be read from a faithful rendering. Hue
     and sequence are unchanged. Geometry and sheet position are untouched, and the
     CUT FILE keeps the exact values your laser keys on.
     Cut the file in the repository root, not this one. -->
  <rect x="0.0" y="0.0" width="480.0" height="295.0" fill="#ffffff"/>
<title>Slapstick, comedy</title>
<desc>1 user unit = 1mm. The slapstick's comedy side, drawn by slapstick.rs: three paddles and five handle strips in 3mm ply. Blue #0000ff engraves the face circle and the handle mark, a line, never a cut. Then green #00ff00 cuts the eyes and mouth, orange #ff8000 the rope holes, cyan #00ffff frees the strips and black #000000 the paddles. Neighbouring parts share a cut line.</desc>
