<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="480mm" height="295mm" viewBox="0 0 480 295">
<title>Slapstick, tragedy</title>
<desc>1 user unit = 1mm. The slapstick's tragedy side, drawn by slapstick.rs: three paddles and five handle strips in 3mm ply. Blue #0000ff engraves the face circle and the handle mark, a line, never a cut. Then green #00ff00 cuts the eyes and mouth, orange #ff8000 the rope holes, cyan #00ffff frees the strips and black #000000 the paddles. Neighbouring parts share a cut line.</desc>
